<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manuora</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f7a6c'/%3E%3Cpath d='M8 23V10l8 7 8-7v13' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" aria-label="Navigation">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M8 23V10l8 7 8-7v13" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand-name">Manuora</span>
    </div>
    <button class="nav-btn new-chat" id="new-chat" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      New chat
    </button>
    <a class="nav-btn" href="#/chat" data-route="chat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>
      Chat
    </a>
    <a class="nav-btn" href="#/library" data-route="library">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v15H6.5A2.5 2.5 0 0 0 4 20.5 2.5 2.5 0 0 0 6.5 23H19"/><path d="M8 7h7"/></svg>
      Library
      <span class="count" id="jobs-count" hidden></span>
    </a>
    <div class="sidebar-spacer"></div>
    <section class="model-card" aria-label="Generation model">
      <div class="model-head"><span class="dot" id="model-dot"></span><span class="model-name" id="model-name">Generation model</span></div>
      <p class="model-state" id="model-state" role="status">Checking…</p>
      <div class="model-actions">
        <button class="btn" id="model-load" type="button" disabled>Load</button>
        <button class="btn" id="model-unload" type="button" disabled>Unload</button>
      </div>
    </section>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main>
    <section class="view chat-empty" id="view-chat" aria-label="Chat">
      <div class="topbar">
        <button class="btn ghost" id="menu" type="button" aria-label="Open menu">☰</button>
        <span class="brand-name">Manuora</span>
      </div>
      <div id="thread"><div class="column" id="column"></div></div>
      <button class="to-bottom" id="to-bottom" type="button" hidden aria-label="Scroll to latest">↓</button>
      <div class="composer-wrap">
        <form class="composer" id="chat-form">
          <label class="sr-only" for="question">Your question</label>
          <textarea id="question" rows="1" placeholder="Ask about any manual…" required></textarea>
          <div class="composer-row">
            <div class="scope" aria-label="Search scope">
              <span class="chip"><label class="sr-only" for="product">Product</label><select id="product"><option value="">All products</option></select></span>
              <span class="chip"><label class="sr-only" for="version">Version</label><select id="version"><option value="">Any version</option></select></span>
              <span class="chip"><label class="sr-only" for="document">Manual</label><select id="document"><option value="">All manuals</option></select></span>
            </div>
            <button class="send" id="send" type="submit" aria-label="Send" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </form>
        <p class="hint" id="status" role="status">Answers cite the manual pages they come from. Check important steps against the source.</p>
      </div>
    </section>

    <section class="view" id="view-library" aria-label="Library" hidden>
      <div class="topbar">
        <button class="btn ghost" data-menu type="button" aria-label="Open menu">☰</button>
        <span class="brand-name">Manuora</span>
      </div>
      <div class="page" id="library"></div>
    </section>
  </main>
</div>

<dialog id="confirm">
  <h2 id="confirm-title"></h2>
  <p id="confirm-body"></p>
  <div class="row"><button class="btn" value="cancel" id="confirm-cancel">Cancel</button><button class="btn danger" id="confirm-ok">Remove</button></div>
</dialog>

<script src="/assets/app.js"></script>
<script src="/assets/library.js"></script>
</body>
</html>
