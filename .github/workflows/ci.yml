name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # Model-free tests: stub retriever/reranker/LLM, no manuals, no Qdrant. Answer quality is checked
    # locally with the benchmark (python -m manuora.evaluation.run), not here.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only torch, then the project)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[generation,ingestion,geometry,embeddings,test]"
      - name: Benchmark file is valid
        run: python -m manuora.evaluation.bench check
      - name: Unit tests
        run: python -m pytest tests/unit -q -p no:cacheprovider --junitxml=pytest.xml
      - name: Test summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          s = ET.parse("pytest.xml").getroot()
          s = s.find("testsuite") if s.tag == "testsuites" else s
          print(f"**{s.get('tests')} tests**: {s.get('failures')} failed, {s.get('errors')} errors, {s.get('skipped')} skipped")
          EOF
